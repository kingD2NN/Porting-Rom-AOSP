name: Port MIUI 14 / HyperOS -> ingres

# Port ROM MIUI 14 (Android 13) atau HyperOS dari HP Xiaomi lain ke ingres (POCO F4 GT / K50 Gaming)
# memakai toolkit toraidl/hyperos_port (base = ROM resmi MIUI/HyperOS ingres). Toolkit ditambal
# scripts/miui_toolkit_patch.py supaya donor MIUI 14 (tanpa partisi mi_ext) ikut didukung.
# Untuk donor ROM AOSP (LineageOS, AxionOS, EvoX, ...) pakai workflow "Port AOSP -> ingres".

on:
  workflow_dispatch:
    inputs:
      base_rom_url:
        description: "URL ROM base ingres: default RYUUI MIUI 14 ingres (V14.0.11.0.TLJCNXM, Android 13). Bisa juga OTA recovery MIUI 14 / HyperOS ingres (.zip payload.bin) atau zip gaya xiaomi.eu (images/super.img.*). Versi Android base harus <= donor"
        required: true
        default: "https://drive.usercontent.google.com/download?id=14HgNUJiiEvyzjDQXFaQVgjVcsZulF2ht&export=download&confirm=t"
        type: string
      port_rom_url:
        description: "URL ROM donor MIUI 14 / HyperOS (.zip berisi payload.bin, atau fastboot .tgz). Ideal: SM8450 (mis. marble, diting, cupid)"
        required: true
        type: string
      repack_ext4:
        description: "Partisi port dibangun EXT4 (bisa mount rw). false = ikut filesystem base (EROFS)"
        required: false
        default: true
        type: boolean
      remove_encryption:
        description: "Matikan enkripsi data (butuh Format Data saat flash)"
        required: false
        default: false
        type: boolean
      upload_release:
        description: "Unggah hasil ke GitHub Release (tag port-miui-<tanggal>), selain artifact"
        required: false
        default: false
        type: boolean
      boot_img_url:
        description: "Opsional: URL boot.img kernel custom. Dicek otomatis vs modul vendor base (CRC); tidak cocok = kernel bawaan base dipakai. Kosong = kernel base"
        required: false
        default: ""
        type: string
  # dipanggil workflow lain (mis. port-hyperos-ingres.yml) dengan default berbeda
  workflow_call:
    inputs:
      base_rom_url: { type: string, required: true }
      port_rom_url: { type: string, required: true }
      repack_ext4: { type: boolean, required: false, default: true }
      remove_encryption: { type: boolean, required: false, default: false }
      upload_release: { type: boolean, required: false, default: false }
      boot_img_url: { type: string, required: false, default: "" }
      title: { type: string, required: false, default: "Port MIUI 14 / HyperOS -> ingres" }

env:
  TOOLKIT_REPO: toraidl/hyperos_port
  TOOLKIT_SHA: 523b0f6378e77e9e93ba6e15a064f45b26274eab
  DEVICE_CODE: INGRES

concurrency:
  group: port-miui-ingres-${{ github.ref }}
  cancel-in-progress: false

jobs:
  port:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - name: Kosongkan disk runner
        uses: jlumbroso/free-disk-space@v2
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependensi toolkit
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 python3 busybox zip unzip p7zip-full openjdk-21-jre-headless \
            zstd bc android-sdk-libsparse-utils xmlstarlet openssl python3-protobuf zipalign e2fsprogs lz4 >/dev/null
          # kallsyms-finder: cek CRC kernel custom vs modul vendor base
          pip3 install --break-system-packages -q "git+https://github.com/marin-m/vmlinux-to-elf@19683fb95b29cd31362d49e6f48ab8368f96cbdf" \
            || echo "::warning::vmlinux-to-elf gagal dipasang, kernel custom tidak bisa dicek (kernel base dipakai)"

      - name: Ambil toolkit hyperos_port (pinned) + tambalan MIUI 14
        run: |
          set -euo pipefail
          git init -q hyperos_port
          cd hyperos_port
          git remote add origin "https://github.com/${TOOLKIT_REPO}.git"
          git fetch -q --depth 1 origin "$TOOLKIT_SHA"
          git checkout -q FETCH_HEAD
          chmod -R +x bin/Linux/x86_64 otatools/bin 2>/dev/null || true
          # bin/port_config: ext4 / enkripsi sesuai input
          sed -i "s/^repack_with_ext4=.*/repack_with_ext4=${{ inputs.repack_ext4 }}/" bin/port_config
          sed -i "s/^remove_data_encryption=.*/remove_data_encryption=${{ inputs.remove_encryption }}/" bin/port_config
          python3 "$GITHUB_WORKSPACE/scripts/miui_toolkit_patch.py" .
          bash -n port.sh
          grep -E '^(partition_to_port|repack_with_ext4|remove_data_encryption|pack_method)=' bin/port_config

      - name: Unduh ROM base & donor
        env:
          BASE: ${{ inputs.base_rom_url }}
          PORT: ${{ inputs.port_rom_url }}
          BOOT: ${{ inputs.boot_img_url }}
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
        run: |
          set -euo pipefail
          cd hyperos_port
          # nama file asli dari server (Google Drive/SourceForge/...), halaman konfirmasi dilewati
          base=$(bash "$GITHUB_WORKSPACE/scripts/fetch_rom.sh" "$BASE" dl_base)
          port=$(bash "$GITHUB_WORKSPACE/scripts/fetch_rom.sh" "$PORT" dl_port)
          # toolkit membaca kode device dari nama file base (miui_<KODE>_..., xiaomi.eu_<KODE>_...)
          bname=$(basename "$base")
          case $bname in miui_*|xiaomi.eu_*|*_multi_*) ;; *) bname="miui_${DEVICE_CODE}_${bname}" ;; esac
          case $bname in *.zip) ;; *) bname="$bname.zip" ;; esac
          mv "$base" "$bname"
          pname=$(basename "$port")
          case $pname in *.zip|*.tgz) ;; *) pname="$pname.zip" ;; esac
          mv "$port" "port_$pname"
          echo "BASE_FILE=$bname" >> "$GITHUB_ENV"
          echo "PORT_FILE=port_$pname" >> "$GITHUB_ENV"
          if [ -n "$BOOT" ]; then
            boot=$(bash "$GITHUB_WORKSPACE/scripts/fetch_rom.sh" "$BOOT" dl_boot) || boot=""
            if [ -n "$boot" ] && [ "$(head -c 8 "$boot")" = "ANDROID!" ]; then
              echo "PORT_BOOT_IMG=$PWD/$boot" >> "$GITHUB_ENV"
              echo "boot.img custom: $boot ($(strings -a "$boot" | grep -m1 -oE 'Linux version [0-9][^ ]*' || echo '?'))"
            else
              echo "::warning::boot_img_url gagal diunduh / bukan boot image, kernel base dipakai"
            fi
          fi
          echo "isi zip base:"; unzip -l "$bname" | awk 'NR>3 && $4!="" {print "  "$4}' | grep -vE '^  (META-INF|firmware-update)/' | head -n 25 || true
          df -h . | tail -n1

      - name: Port ROM
        run: |
          set -o pipefail
          cd hyperos_port
          # hook kernel custom (miui_toolkit_patch.py): dipasang hanya kalau CRC cocok dengan modul vendor base
          export PORT_BOOT_HOOK="$GITHUB_WORKSPACE/scripts/miui_boot_hook.sh" KERNEL_REPORT="$GITHUB_WORKSPACE/kernel-used.txt"
          sudo -E env "PATH=$PATH" bash ./port.sh "$BASE_FILE" "$PORT_FILE" 2>&1 | tee "$GITHUB_WORKSPACE/port-miui.log"
          ls -la out/ || true
          z=$(sudo find out -maxdepth 1 -type f -name '*.zip' | head -n1)
          [ -n "$z" ] || { echo "::error::port.sh tidak menghasilkan zip (lihat log)"; exit 1; }
          sudo chown -R "$(id -u):$(id -g)" out
          echo "ROM_ZIP=$PWD/$z" >> "$GITHUB_ENV"
          echo "ROM_NAME=$(basename "$z")" >> "$GITHUB_ENV"

      - name: Upload log (kalau gagal)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: port-miui-log
          path: port-miui.log
          retention-days: 7

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ROM_NAME }}
          path: ${{ env.ROM_ZIP }}
          compression-level: 0
          retention-days: 7

      - name: Upload ke GitHub Release
        if: ${{ inputs.upload_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="port-miui-$(date -u +%Y%m%d-%H%M)"
          split -b 1900M -d "$ROM_ZIP" "$ROM_ZIP.part" && n=$(ls "$ROM_ZIP".part* | wc -l) || n=0
          if [ "$n" -gt 1 ]; then files=("$ROM_ZIP".part*); else files=("$ROM_ZIP"); rm -f "$ROM_ZIP".part*; fi
          gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
            --title "MIUI/HyperOS port ingres $(date -u +%Y-%m-%d)" \
            --notes "Base: ${{ inputs.base_rom_url }}
          Donor: ${{ inputs.port_rom_url }}
          File > 2 GB dipecah: gabungkan dengan \`cat ${ROM_NAME}.part* > ${ROM_NAME}\`."

      - name: Ringkasan
        if: always()
        run: |
          {
            echo "## ${{ inputs.title || 'Port MIUI 14 / HyperOS -> ingres' }}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Base | ${{ inputs.base_rom_url }} |"
            echo "| Donor | ${{ inputs.port_rom_url }} |"
            echo "| Output | ${ROM_NAME:-gagal} |"
            echo "| EXT4 | ${{ inputs.repack_ext4 }} |"
            echo "| Kernel | $(cat kernel-used.txt 2>/dev/null || echo 'base') |"
            grep -aE 'Android Version:|SDK Verson:|ROM Version:|Device Code:' port-miui.log 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g; s/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"
