name: Port OxygenOS -> ingres

# Port OxygenOS / ColorOS / realme UI (OPlus) ke ingres (POCO F4 GT / Redmi K50 Gaming).
# Memanggil workflow "Port AOSP -> ingres" (port-aosp-ingres.yml) dengan mode OPlus:
#   - base = LineageOS 23.2 ingres (default, Android 16): firmware, boot, vendor, odm,
#     vendor_dlkm tetap dari base -> modul vendor cocok dengan kernel D2N 5.10.271-gki-MIX,
#     fitur LineageOS dari base (Aperture, GameKeys, LED) & addon AOSP ikut dipasang
#   - donor = OTA full OxygenOS/ColorOS/realme UI Android 16+ (.zip payload.bin): system,
#     system_ext, product + partisi my_* (digabung ke /system, lihat scripts/oplus_port.sh)
#   - sepolicy: type public system_ext base yang dipakai vendor tapi tidak ada di OxygenOS
#     dijembatani (scripts/sepol_bridge.py)
#   - kernel D2N dicek otomatis vs modul vendor base (tidak cocok = kernel stock base)
#   - donor OxygenOS 15 (Android 15): ganti base ke HyperOS 2 stock ingres (Android 14),
#     https://cdnorg.d.miui.com/OS2.0.5.0.ULJCNXM/ingres-ota_full-OS2.0.5.0.ULJCNXM-user-14.0-f4c2771903.zip
# Tidak ada concurrency di sini: workflow yang dipanggil sudah mengantre per workflow.

on:
  workflow_dispatch:
    inputs:
      base_rom_url:
        description: "URL ROM base ingres (default LineageOS 23.2 ingres, Android 16 -> kernel D2N cocok). Donor OxygenOS 15: pakai HyperOS 2 stock ingres (lihat komentar workflow). Versi Android base harus <= donor"
        required: true
        default: "https://github.com/Ingres-Centre/LineageOS-Releases/releases/download/LineageOS-20260209-LAST/lineage-23.2-20260209-UNOFFICIAL-ingres.zip"
        type: string
      port_rom_url:
        description: "URL OTA full OxygenOS/ColorOS/realme UI Android 16+ (.zip payload.bin, ada partisi my_*). Ideal SoC dekat: SM8450/SM8475"
        required: true
        type: string
      package_type:
        description: "ota = payload.bin (flash di recovery) | recovery = images + super.img.zst"
        required: false
        default: ota
        type: choice
        options:
          - ota
          - recovery
      super_size:
        description: "Ukuran partisi super (byte). ingres = 9126805504"
        required: false
        default: "9126805504"
        type: string
      ext4_partitions:
        description: "Partisi EXT4 (sisanya EROFS lz4hc). Kosong = semua EROFS, paling hemat tempat (ROM OPlus besar)"
        required: false
        default: ""
        type: string
      debloat:
        description: "Debloat tambahan: package / folder / path (mis. my_stock/app/Foo). Awalan ! = pertahankan dari debloat_oplus.txt"
        required: false
        default: ""
        type: string
      base_extras:
        description: "Salin fitur LineageOS ingres dari base: Aperture (kamera, pengganti kamera OnePlus) + GameKeys (tombol bahu) + Leds (LED RGB). Hanya untuk base LineageOS"
        required: false
        default: true
        type: boolean
      addons:
        description: "Addon (pisah spasi): miuicamera, dolby, touchrate, wfd, hotword. Dicek per versi Android & dependensi; gagal = dibatalkan otomatis. none = tanpa addon"
        required: false
        default: "miuicamera dolby touchrate wfd hotword"
        type: string
      oplus_debloat:
        description: "Pakai debloat_oplus.txt (kamera OPlus, overlay sidik jari di layar, stub pihak ketiga, app Google opsional)"
        required: false
        default: true
        type: boolean
      maintainer:
        description: "Ditambahkan ke nomor build di Tentang ponsel (UNOFFICIAL by <maintainer>). Kosong = tidak diubah"
        required: false
        default: "KingD2N"
        type: string
      boot_img_url:
        description: "URL boot.img kernel custom (default D2N 5.10.271-gki-MIX). Dicek vs modul vendor base: tidak cocok = kernel stock base. Kosong = kernel base"
        required: false
        default: "https://github.com/kingD2N/ALL-PROJECT-D2N/releases/download/TES/boot.img"
        type: string
      disable_encryption:
        description: "Matikan fileencryption/metadata_encryption di fstab"
        required: false
        default: true
        type: boolean
      debug_adb:
        description: "ADB aktif sejak boot tanpa konfirmasi (hanya untuk logcat saat bootloop)"
        required: false
        default: false
        type: boolean
      release_keys:
        description: "Samarkan build jadi user/release-keys + ro.debuggable=0 (aplikasi bank & Play Integrity basic di ROM tanpa root)"
        required: false
        default: true
        type: boolean
      sepolicy_strict:
        description: "Build GAGAL kalau sepolicy gabungan (system OPlus + vendor Xiaomi) tidak bisa di-compile"
        required: false
        default: true
        type: boolean
      recovery_img_url:
        description: "URL recovery.img custom (default TWRP D2N). Kosong = recovery HP tidak disentuh"
        required: false
        default: "https://github.com/kingD2N/ALL-PROJECT-D2N/releases/download/ingres/TWRP_PROJECT_recovery_A16_A17_.img"
        type: string
      release_repo:
        description: "owner/repo untuk GitHub Release (kosong = upload artifact)"
        required: false
        default: ""
        type: string
      gdrive_upload:
        description: "Upload juga ke Google Drive (butuh secret RCLONE_CONFIG)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  port:
    uses: ./.github/workflows/port-aosp-ingres.yml
    secrets: inherit
    with:
      base_rom_url: ${{ inputs.base_rom_url }}
      port_rom_url: ${{ inputs.port_rom_url }}
      package_type: ${{ inputs.package_type }}
      super_size: ${{ inputs.super_size }}
      ext4_partitions: ${{ inputs.ext4_partitions }}
      debloat: ${{ inputs.debloat }}
      oplus_debloat: ${{ inputs.oplus_debloat }}
      maintainer: ${{ inputs.maintainer }}
      boot_img_url: ${{ inputs.boot_img_url }}
      disable_encryption: ${{ inputs.disable_encryption }}
      rw_mount: false
      debug_adb: ${{ inputs.debug_adb }}
      release_keys: ${{ inputs.release_keys }}
      sepolicy_strict: ${{ inputs.sepolicy_strict }}
      recovery_img_url: ${{ inputs.recovery_img_url }}
      release_repo: ${{ inputs.release_repo }}
      gdrive_upload: ${{ inputs.gdrive_upload }}
      base_extras: ${{ inputs.base_extras }}
      addons: ${{ inputs.addons }}
      copy_from_base: ""
      port_flavor: oplus
      title: "Port OxygenOS"
