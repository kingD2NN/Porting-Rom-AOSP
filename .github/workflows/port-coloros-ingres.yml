name: Port ColorOS -> ingres

# Port ColorOS (OPPO / OnePlus / realme, OPlus) khusus POCO F4 GT / Redmi K50 Gaming (ingres),
# kombinasi vendor LineageOS 23.2 ingres. Memanggil workflow "Port AOSP -> ingres"
# (port-aosp-ingres.yml) dengan mode OPlus (scripts/oplus_port.sh):
#   - base = LineageOS 23.2 ingres (Android 16): firmware, boot, vendor, odm, vendor_dlkm dari
#     base -> modul vendor cocok dengan kernel D2N 5.10.271-gki-MIX; fitur LineageOS dari base
#     (Aperture kamera, GameKeys, LED) & addon AOSP ikut dipasang
#   - donor = ColorOS Android 16+ (ColorOS 16 / 17):
#       * OTA full OPPO/OnePlus/realme (.zip payload.bin, partisi my_* terpisah) -> my_* digabung
#         ke /system, atau
#       * ColorOS hasil port HP lain (zip recovery images/super.img, my_* sudah di system, mis.
#         ColorOS 17 marble) -> my_* dipakai apa adanya
#     boot/kernel, vendor & odm donor TIDAK dipakai (kernel port marble berisi driver OPlus
#     khusus marble); yang diambil hanya system, system_ext, product, my_*
#   - sepolicy: jembatan type public system_ext base (scripts/sepol_bridge.py) + permission
#     vendor yang belum dikenal system donor dibuang (scripts/sepol_compat.py, mis. nlmsg)
#   - donor OxygenOS/realme UI juga bisa (mesin yang sama), nama ROM di zip tetap otomatis kalau
#     rom_name = auto
# Tidak ada concurrency di sini: workflow yang dipanggil sudah mengantre per workflow.

on:
  workflow_dispatch:
    inputs:
      base_rom_url:
        description: "URL ROM base ingres (default LineageOS 23.2 ingres, Android 16 -> kernel D2N cocok). Versi Android base harus <= donor (ColorOS 16/17)"
        required: true
        default: "https://github.com/Ingres-Centre/LineageOS-Releases/releases/download/LineageOS-20260209-LAST/lineage-23.2-20260209-UNOFFICIAL-ingres.zip"
        type: string
      port_rom_url:
        description: "URL ROM ColorOS Android 16+ : OTA full OPPO/OnePlus/realme (.zip payload.bin, partisi my_*) atau ColorOS hasil port HP lain (zip images/super.img, mis. ColorOS 17 marble)"
        required: true
        type: string
      package_type:
        description: "ota = payload.bin (flash di recovery) | recovery = folder images/ (firmware + boot + recovery + super.img utuh) seperti zip LightOS/xiaomi.eu"
        required: false
        default: ota
        type: choice
        options:
          - ota
          - recovery
      firmware_url:
        description: "package_type recovery: firmware ingres (xbl, tz, modem, ...) dari OTA full / fastboot ROM stok ingres, ikut di images/ seperti zip LightOS/xiaomi.eu. Default HyperOS 2 OS2.0.5.0 (sama dengan vendor LineageOS 23.2). none = tanpa firmware"
        required: false
        default: "https://cdnorg.d.miui.com/OS2.0.5.0.ULJCNXM/ingres-ota_full-OS2.0.5.0.ULJCNXM-user-14.0-f4c2771903.zip"
        type: string
      super_size:
        description: "Ukuran partisi super (byte). ingres = 9126805504"
        required: false
        default: "9126805504"
        type: string
      ext4_partitions:
        description: "Partisi EXT4 (sisanya EROFS lz4hc). Kosong = semua EROFS, paling hemat tempat (ROM OPlus besar)"
        required: false
        default: ""
        type: string
      debloat:
        description: "Debloat tambahan: package / folder / path (mis. my_stock/app/Foo). Awalan ! = pertahankan dari debloat_oplus.txt"
        required: false
        default: ""
        type: string
      debloat_aosp:
        description: "Juga pakai debloat_aosp.txt (Debloat Full AOSP A16: app Google/AOSP opsional). ColorOS sudah punya debloat_oplus.txt"
        required: false
        default: false
        type: boolean
      base_extras:
        description: "Salin fitur LineageOS ingres dari base: Aperture (kamera, pengganti kamera OnePlus) + GameKeys (tombol bahu) + Leds (LED RGB). Hanya untuk base LineageOS"
        required: false
        default: true
        type: boolean
      addons:
        description: "Addon (pisah spasi): miuicamera, dolby, touchrate, wfd, hotword. Dicek per versi Android & dependensi; gagal = dibatalkan otomatis. none = tanpa addon"
        required: false
        default: "miuicamera dolby touchrate wfd hotword"
        type: string
      rom_name:
        description: "Nama ROM di nama zip & ringkasan: ColorOS (default) | auto (dari props donor: ColorOS / OxygenOS / realmeUI)"
        required: false
        default: ColorOS
        type: string
      oplus_debloat:
        description: "Pakai debloat_oplus.txt (kamera OPlus, overlay sidik jari di layar, stub pihak ketiga, app Google opsional)"
        required: false
        default: true
        type: boolean
      maintainer:
        description: "Ditambahkan ke nomor build di Tentang ponsel (UNOFFICIAL by <maintainer>). Kosong = tidak diubah"
        required: false
        default: "KingD2N"
        type: string
      boot_img_url:
        description: "URL boot.img kernel custom (default D2N 5.10.271-gki-MIX). Dicek vs modul vendor base: tidak cocok = kernel stock base. Kosong = kernel base"
        required: false
        default: "https://github.com/kingD2N/ALL-PROJECT-D2N/releases/download/TES/boot.img"
        type: string
      disable_encryption:
        description: "Matikan fileencryption/metadata_encryption di fstab"
        required: false
        default: true
        type: boolean
      debug_adb:
        description: "ADB aktif sejak boot tanpa konfirmasi (hanya untuk logcat saat bootloop)"
        required: false
        default: false
        type: boolean
      release_keys:
        description: "Samarkan build jadi user/release-keys + ro.debuggable=0 (aplikasi bank & Play Integrity basic di ROM tanpa root)"
        required: false
        default: true
        type: boolean
      fingerprint:
        description: "Sidik jari (Tentang ponsel): auto = fingerprint firmware stok ingres dari vendor base (mis. Redmi/ingres/ingres:14/UKQ1.240624.001/OS2.0.5.0.ULJCNXM:user/release-keys) seperti ROM asli | donor = fingerprint ROM donor | atau tulis fingerprint lengkap"
        required: false
        default: auto
        type: string
      sepolicy_strict:
        description: "Build GAGAL kalau sepolicy gabungan (system OPlus + vendor Xiaomi) tidak bisa di-compile"
        required: false
        default: true
        type: boolean
      recovery_img_url:
        description: "URL recovery.img custom (default TWRP D2N). Kosong = recovery HP tidak disentuh"
        required: false
        default: "https://github.com/kingD2N/ALL-PROJECT-D2N/releases/download/ingres/TWRP_PROJECT_recovery_A16_A17_.img"
        type: string
      release_repo:
        description: "owner/repo untuk GitHub Release (kosong = upload artifact)"
        required: false
        default: ""
        type: string
      gdrive_upload:
        description: "Upload juga ke Google Drive (butuh secret RCLONE_CONFIG)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  port:
    uses: ./.github/workflows/port-aosp-ingres.yml
    secrets: inherit
    with:
      base_rom_url: ${{ inputs.base_rom_url }}
      port_rom_url: ${{ inputs.port_rom_url }}
      package_type: ${{ inputs.package_type }}
      firmware_url: ${{ inputs.firmware_url }}
      super_size: ${{ inputs.super_size }}
      ext4_partitions: ${{ inputs.ext4_partitions }}
      debloat: ${{ inputs.debloat }}
      debloat_aosp: ${{ inputs.debloat_aosp }}
      oplus_debloat: ${{ inputs.oplus_debloat }}
      maintainer: ${{ inputs.maintainer }}
      boot_img_url: ${{ inputs.boot_img_url }}
      disable_encryption: ${{ inputs.disable_encryption }}
      rw_mount: false
      debug_adb: ${{ inputs.debug_adb }}
      release_keys: ${{ inputs.release_keys }}
      fingerprint: ${{ inputs.fingerprint }}
      sepolicy_strict: ${{ inputs.sepolicy_strict }}
      recovery_img_url: ${{ inputs.recovery_img_url }}
      release_repo: ${{ inputs.release_repo }}
      gdrive_upload: ${{ inputs.gdrive_upload }}
      base_extras: ${{ inputs.base_extras }}
      addons: ${{ inputs.addons }}
      copy_from_base: ""
      port_flavor: oplus
      oplus_rom_name: ${{ inputs.rom_name }}
      title: "Port ColorOS"
